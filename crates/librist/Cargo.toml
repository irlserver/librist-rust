[package]
name = "librist"
description = "Safe Rust bindings to the librist C library for RIST protocol (video streaming)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Async support via Tokio runtime
async-tokio = ["dep:tokio", "dep:futures-core"]
# Serialization support for config/stats
serde = ["dep:serde"]
# Enable tracing integration
tracing = ["dep:tracing"]

[dependencies]
librist-sys = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
scopeguard = { workspace = true }
bitflags = { workspace = true }

# Optional dependencies
tokio = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
env_logger = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
rusty-fork = "0.3"

[package.metadata.docs.rs]
all-features = true
