[package]
name = "librist-sys"
description = "Raw FFI bindings to the librist C library for RIST protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/librist-sys"
homepage = "https://github.com/irlserver/librist-rust"
links = "rist"
build = "build.rs"

# Include only what's needed for building - vendored source is in librist submodule
include = [
    "src/**/*",
    "build.rs",
    "wrapper.h",
    "Cargo.toml",
    "librist/src/**",
    "librist/include/**",
    "librist/contrib/**",
    "librist/common/**",
    "librist/compat/**",
    "librist/meson.build",
    "librist/meson_options.txt",
]

[features]
default = ["bundled", "mbedtls"]
# Build librist from source (default)
bundled = []
# Use system-installed librist
system = []
# Static linking (default on macOS)
static = []
# Enable mbedTLS for encryption
mbedtls = []
# Enable SRP authentication (requires mbedtls)
srp = ["mbedtls"]

[dependencies]
libc = "0.2"

[build-dependencies]
bindgen = { workspace = true }
pkg-config = { workspace = true }
cc = { workspace = true }

[package.metadata.docs.rs]
features = ["bundled"]
