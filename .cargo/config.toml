# Cargo configuration for librist-rust

[env]
# Rerun builds if librist source changes
LIBRIST_RERUN = "crates/librist-sys/librist"

[target.x86_64-unknown-linux-gnu]
rustflags = [
    # Set rpath for finding shared libraries at runtime
    "-C", "link-arg=-Wl,-rpath,$ORIGIN",
]

[target.aarch64-unknown-linux-gnu]
rustflags = [
    "-C", "link-arg=-Wl,-rpath,$ORIGIN",
]

[alias]
# Convenience aliases
xtask = "run --package xtask --"
