[workspace]
resolver = "2"
members = [
    "crates/librist-sys",
    "crates/librist",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/irlserver/librist-rust"
keywords = ["rist", "video", "streaming", "networking", "protocol"]
categories = ["multimedia::video", "network-programming"]

[workspace.dependencies]
# Internal dependencies
librist-sys = { path = "crates/librist-sys", version = "0.1.0" }

# External dependencies
thiserror = "2.0"
log = "0.4"
parking_lot = "0.12"
scopeguard = "1.2"
bitflags = "2.4"

# Optional async runtimes
tokio = { version = "1.43", features = ["rt", "sync", "time"] }

# Build dependencies
bindgen = "0.71"
pkg-config = "0.3"
cc = "1.2"

# Dev dependencies
tracing = "0.1"
tracing-subscriber = "0.3"
env_logger = "0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
# Speed up compilation
debug = 1
